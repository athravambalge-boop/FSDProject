<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MessMate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">
        Admin Dashboard 👨‍💼
        <div class="user-bar">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </h1>

    <div class="dashboard">
        <h2>Add New Mess</h2>
        <input type="text" id="name" placeholder="Mess Name" required>
        <input type="text" id="location" placeholder="Location" required>
        <select id="veg_type" required>
            <option value="">Select Type</option>
            <option value="Veg">Vegetarian</option>
            <option value="Non-Veg">Non-Vegetarian</option>
            <option value="Mixed">Mixed</option>
        </select>
        <input type="text" id="contact_number" placeholder="Contact Number" required>
        <button onclick="addMess()">Add Mess</button>
    </div>

    <h2 style="text-align:center; color: white; margin-top: 30px;">All Messes</h2>
    <div id="messList"></div>

    <div class="dashboard" style="max-width: 1000px; margin: 30px auto;">
        <h2>Chatbot Intent JSON</h2>
        <p style="color:#2c3e50; margin-bottom: 10px;">
            Edit chatbot intent mapping here and click Save. Changes apply immediately on next page load.
        </p>
        <textarea id="chatbotIntentJson" maxlength="8000" style="width:100%; min-height:280px; border:2px solid #ecf0f1; border-radius:8px; padding:12px; font-family: 'Consolas', 'Courier New', monospace; font-size:12px; line-height:1.45; resize:vertical;"></textarea>
        <p id="chatbotIntentCounter" style="margin-top:8px; margin-bottom:0; font-size:12px; color:#5d6d7e; text-align:right;">0 / 8000 characters</p>
        <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
            <button onclick="insertIntentRuleTemplate()" style="width:auto; padding:8px 14px; background:#5dade2;">+ Rule Template</button>
            <button onclick="insertPageIntentTemplate()" style="width:auto; padding:8px 14px; background:#48c9b0;">+ Page Intent Template</button>
            <button onclick="insertOrderStatusRuleTemplate()" style="width:auto; padding:8px 14px; background:#f39c12;">+ Order Status Rule</button>
            <button onclick="formatChatbotIntentJson()" style="width:auto; padding:8px 14px; background:#7f8c8d;">Format JSON</button>
        </div>
        <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
            <button onclick="saveChatbotIntentJson()" style="width:auto; padding:10px 18px;">Save JSON</button>
            <button onclick="resetChatbotIntentJson()" style="width:auto; padding:10px 18px; background:#7f8c8d;">Reset to Default</button>
        </div>
        <p id="chatbotIntentMessage" style="margin-top: 10px; font-size: 13px; color: #2c3e50;"></p>
    </div>
    
    <!-- Edit Modal -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Mess</h2>
            <input type="hidden" id="editMessId">
            <input type="text" id="editName" placeholder="Mess Name" required>
            <input type="text" id="editLocation" placeholder="Location" required>
            <select id="editVegType" required>
                <option value="">Select Type</option>
                <option value="Veg">Vegetarian</option>
                <option value="Non-Veg">Non-Vegetarian</option>
                <option value="Mixed">Mixed</option>
            </select>
            <input type="text" id="editContact" placeholder="Contact Number" required>
            <div style="display: flex; gap: 10px;">
                <button onclick="saveEditMess()" style="flex: 1;">Save</button>
                <button onclick="closeEditModal()" style="flex: 1; background: #95a5a6;">Cancel</button>
            </div>
        </div>
    </div>
    <a href="index.html">← Back to Home</a>

<script src="utils.js"></script>
<script src="admin.js"></script>

</body>

</html>
