<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Pccoe Campus Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title"><a href="landing.html" class="title-brand">Pccoe Campus Bites</a></h1>

    <div class="login-container">
        <h2>Forgot Password</h2>
        <p class="auth-subtitle">Enter your username. OTP will be sent to your registered phone number or email.</p>
        <p id="error"></p>

        <input type="text" id="fpUsername" placeholder="Enter username" required>
        <button id="sendOtpBtn" onclick="sendOtpToRegisteredContact()">Send OTP</button>

        <div class="auth-helper" id="fpStatusMessage" hidden></div>
        <div class="auth-helper warning" id="fpDevOtpHint" hidden></div>

        <div class="otp-section" id="otpSection" hidden>
            <input type="text" id="fpOtpInput" placeholder="Enter 6-digit OTP" inputmode="numeric" maxlength="6">
            <button class="secondary-btn" id="verifyOtpBtn" onclick="verifyOtpForUsername()">Verify OTP</button>

            <div id="resetPasswordSection" hidden>
                <input type="password" id="fpNewPassword" placeholder="New password (min 6 chars)">
                <input type="password" id="fpConfirmPassword" placeholder="Confirm new password">
                <button id="updatePasswordBtn" onclick="updatePasswordByUsername()">Update Password</button>
            </div>
        </div>

        <p class="auth-footer-link">
            <a href="login.html">Back to Login</a>
        </p>
    </div>

    <script src="utils.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
