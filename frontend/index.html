<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessMate - Find Your Mess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">
        MessMate 🍽️
        <div class="user-bar">
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="userName"></span>
                <span id="userPhone" style="font-size: 12px; opacity: 0.8;"></span>
            </div>
            <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
            <a href="login.html" id="loginLink"><button class="login-btn">Login</button></a>
        </div>
    </h1>

    <!-- Search & Filter -->
    <div class="search-container">
        <h3>Find Your Mess 🔍</h3>
        <div class="search-filters">
            <input type="text" id="searchInput" placeholder="Search by name or location...">
            <input type="text" id="locationFilter" placeholder="Filter by location...">
            <input type="number" id="minPrice" placeholder="Min Price" min="0">
            <input type="number" id="maxPrice" placeholder="Max Price" min="0">
            <select id="ratingFilter">
                <option value="">All Ratings</option>
                <option value="4.5">4.5+ Stars</option>
                <option value="4">4+ Stars</option>
                <option value="3.5">3.5+ Stars</option>
            </select>
            <button onclick="applyFilters()" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">Search</button>
        </div>
    </div>

    <!-- Mess List -->
    <div id="mess-container"></div>

    <!-- Links for logged-in users -->
    <div style="text-align: center; margin: 40px; display: none;" id="userLinks">
        <a href="order-history.html">
            <button style="width: auto; padding: 10px 20px; margin: 0 10px;">📋 My Orders</button>
        </a>
        <a href="track-order.html">
            <button style="width: auto; padding: 10px 20px; margin: 0 10px;">📍 Track Order</button>
        </a>
    </div>

    <script src="utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
