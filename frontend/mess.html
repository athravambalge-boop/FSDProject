<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Food - Pccoe Campus Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title"><a href="landing.html" class="title-brand">Pccoe Campus Bites</a></h1>

    <div class="menu-page-header">
        <a href="index.html" class="menu-back-link menu-back-link-top">← Back to Messes</a>
        <h2 id="messTitle">Choose Order</h2>
        <div class="menu-search-wrap">
            <input type="text" id="menuSearchInput" class="menu-search-input" placeholder="Search food by name or category...">
        </div>
    </div>

    <!-- Menu Items -->
    <div id="menuContainer" class="menu-page-container"></div>

    <!-- Cart -->
    <div id="cartSection" style="max-width:1000px; margin:20px auto; padding:0 20px; display:none;">
        <div class="dashboard">
            <h2>Your Order 🛒</h2>
            <div id="walletInfo" class="wallet-inline-info" style="display:none;">
                <span>Wallet Balance:</span>
                <strong id="walletBalanceText">₹0.00</strong>
            </div>
            <div id="cartItems"></div>
            <p id="cartTotal" style="color:#27ae60; font-weight:700; font-size:20px; margin:15px 0;"></p>
            <label class="wallet-use-row" id="walletUseRow" style="display:none;">
                <input type="checkbox" id="useWalletCheckbox">
                <span>Use wallet cash for this order</span>
            </label>
            <input type="text" id="customerName" placeholder="Your Full Name" required>
            <input type="text" id="customerPhone" placeholder="Your Phone Number (10 digits)" required>
            <input type="email" id="customerEmail" placeholder="Your Email (optional)">
            <div style="margin-top: 12px; padding: 12px; border: 1px solid #ecf0f1; border-radius: 8px; background: #fafafa;">
                <p style="margin: 0 0 8px 0; font-weight: 600; color: #2c3e50;">Payment Method</p>
                <label style="display: inline-flex; align-items: center; gap: 8px; color: #2c3e50;">
                    <input type="radio" name="paymentMethod" value="online" checked>
                    QR Payment + Upload Receipt
                </label>
            </div>
            <button onclick="placeOrder()" style="background: linear-gradient(135deg, #27ae60, #2ecc71); margin-top: 15px;">
                Book Food
            </button>
        </div>
    </div>

    <!-- Order Summary -->
    <div id="orderSummarySection" class="order-summary-section" style="display:none;"></div>

    <!-- Order Success Modal -->
    <div id="successModal" class="modal" style="display:none;">
        <div class="modal-content" style="text-align:center;">
            <div style="font-size:60px;">🎉</div>
            <h2 style="color:#27ae60;">Order Placed!</h2>
            <p style="color:#7f8c8d; margin:10px 0;">Your Order ID is:</p>
            <p id="orderId" style="font-size:22px; font-weight:700; color:#667eea; 
                background:#f0f0f0; padding:10px; border-radius:8px; margin:10px 0;"></p>
            <p id="orderTotal" style="color:#27ae60; font-weight:700; font-size:18px;"></p>
            <p id="orderWalletInfo" style="color:#667eea; font-weight:600; font-size:14px;"></p>
            <p style="color:#7f8c8d; font-size:13px; margin:10px 0;">
                Show this Order ID at the mess counter to collect your food.
            </p>
            <button onclick="closeSuccessModal()" style="margin-top:10px;">
                Back to Menu
            </button>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="menu.js"></script>
</body>
</html>
