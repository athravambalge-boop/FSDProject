<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Pccoe Campus Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title"><a href="landing.html" class="title-brand">Pccoe Campus Bites</a></h1>

    <div class="saved-account-card" id="savedAccountCard" hidden>
        <h3>Saved account found</h3>
        <p id="savedAccountText"></p>
        <button onclick="continueWithSavedAccount()">Continue on this device</button>
    </div>

    <div class="login-container">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Create a visitor account with a one-time password sent to your phone number or email.</p>
        <p id="error"></p>

        <input type="text" id="fullName" placeholder="Full name" required>

        <div class="auth-switch">
            <button type="button" id="phoneModeBtn" onclick="setContactMode('phone')">Use Phone</button>
            <button type="button" id="emailModeBtn" class="inactive" onclick="setContactMode('email')">Use Email</button>
        </div>

        <input type="text" id="contactValue" placeholder="10-digit phone number" inputmode="numeric" required>

        <div class="auth-helper">
            Only one account can be created for each phone number or email address.
        </div>

        <button id="requestOtpBtn" onclick="requestOtp()">Send OTP</button>

        <div class="otp-section" id="otpSection" hidden>
            <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" inputmode="numeric" maxlength="6">
            <div class="auth-helper" id="otpMessage" hidden></div>
            <div class="auth-helper warning" id="devOtpHint" hidden></div>
            <button onclick="verifyOtp()">Verify OTP and Create Account</button>
            <button class="secondary-btn" onclick="requestOtp()">Resend OTP</button>
        </div>

        <p class="auth-footer-link">
            Already have an owner account? <a href="login.html">Go to login</a>
        </p>
    </div>

    <script src="utils.js"></script>
    <script src="create-account.js"></script>
</body>
</html>
