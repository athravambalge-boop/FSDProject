<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Pccoe Campus Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title"><a href="landing.html" class="title-brand">Pccoe Campus Bites</a></h1>

    <div class="saved-account-card" id="savedAccountCard" hidden>
        <h3>Saved account found</h3>
        <p id="savedAccountText"></p>
        <button onclick="continueWithSavedAccount()">Continue on this device</button>
    </div>

    <div class="login-container">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Sign up with your email and password or use Google.</p>
        <p id="error"></p>

        <input type="email" id="signupEmail" placeholder="Email address" required>
        <input type="password" id="signupPassword" placeholder="Set password (min 6 chars)" required>
        <input type="password" id="signupConfirmPassword" placeholder="Confirm password" required>

        <button id="signupBtn" onclick="signupWithEmail()">Create Account</button>

        <div class="oauth-divider">OR</div>

        <button id="googleSignupBtn" onclick="signupWithGoogle()" class="google-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
            </svg>
            Continue with Google
        </button>

        <p class="auth-footer-link">
            Already have an account? <a href="login.html">Go to login</a>
        </p>
    </div>

    <script src="utils.js"></script>
    <script src="create-account.js"></script>
</body>
</html>
