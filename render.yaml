services:
  - type: web
    name: pccoe-campus-bites
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    autoDeploy: true
    disk:
      name: uploads-disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: 18
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 3306
      - key: BACKEND_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false